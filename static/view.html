<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Client - VinetMonitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("rd-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .dark ::-webkit-scrollbar-thumb { background: #27272a; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-gray-200 px-4 py-3 dark:bg-gray-900/90 dark:border-gray-800">
    <div class="max-w-[1400px] mx-auto flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3 min-w-0">
        <!-- <a href="/?token=${TOKEN_QUERY}" class="flex items-center gap-1 text-sm text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-lg px-3 py-2 transition dark:text-gray-400 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700 dark:border-gray-700">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
          Kembali
        </a> -->
        <h1 class="text-lg font-bold text-gray-900 truncate dark:text-white" id="title">Detail Client</h1>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="btnShutdown" class="text-sm text-white bg-red-600 hover:bg-red-500 border border-red-500/50 rounded-lg px-3 py-2 transition">
          Shutdown
        </button>
        <button id="btnRestart" class="text-sm text-white bg-orange-600 hover:bg-orange-500 border border-orange-500/50 rounded-lg px-3 py-2 transition">
          Restart
        </button>
        <button id="themeToggle" title="Ganti tampilan terang/gelap"
                class="flex items-center gap-1.5 text-sm px-3 py-2 rounded-lg border transition bg-white border-gray-300 text-gray-600 hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700">
          <svg id="iconSun" class="w-4 h-4 hidden dark:inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <svg id="iconMoon" class="w-4 h-4 inline dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
        <span id="status" class="text-sm rounded-lg px-3 py-2 border text-gray-600 bg-white border-gray-300 dark:text-gray-300 dark:bg-gray-800 dark:border-gray-700">Belum terhubung</span>
      </div>
    </div>
    <div class="max-w-[1400px] mx-auto mt-1.5 flex items-center justify-between gap-2 flex-wrap">
      <p id="sysinfo" class="text-xs text-blue-600 font-mono dark:text-blue-300"></p>
      <p class="text-xs text-gray-500 dark:text-gray-500">Klik layar untuk menangkap keyboard. Mouse akan dikirim ke client.</p>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-4">
    <section id="screenWrap" class="relative bg-black border border-gray-300 rounded-xl overflow-auto min-h-[320px] flex items-center justify-center dark:border-gray-800">
      <canvas id="screen" tabindex="0" width="960" height="540"
             class="max-w-full outline-none cursor-crosshair focus:outline-2 focus:outline-blue-500"></canvas>

      <div id="offline" class="hidden absolute inset-0 z-10 bg-white/90 backdrop-blur flex-col items-center justify-center gap-3 text-center p-6 dark:bg-black/85">
        <div class="w-16 h-16 rounded-2xl bg-gray-200 border border-gray-300 flex items-center justify-center dark:bg-gray-900 dark:border-gray-700">
          <svg class="w-8 h-8 text-red-500 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Client tidak ditemukan / offline</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400">
          Client <code id="offlineId" class="text-blue-600 bg-gray-200 px-1.5 py-0.5 rounded dark:text-blue-400 dark:bg-gray-900"></code> sedang tidak terhubung.
        </p>
        <a href="/?token=${TOKEN_QUERY}" class="mt-1 text-sm text-white bg-blue-600 hover:bg-blue-500 rounded-lg px-4 py-2 transition">Kembali ke Home</a>
      </div>
    </section>

    <section class="border border-gray-300 rounded-xl overflow-hidden bg-white flex flex-col lg:max-h-[calc(100vh-130px)] dark:border-gray-800 dark:bg-gray-900">
      <div class="sticky top-0 bg-gray-100 px-3 py-2 text-sm font-semibold text-gray-900 border-b border-gray-200 shrink-0 dark:bg-gray-800/95 dark:text-white dark:border-gray-700 flex items-center justify-between gap-2">
        <div class="flex items-center gap-1">
          <button id="btnProcsTab" class="px-2.5 py-1 rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-200 border border-transparent transition dark:text-gray-300 dark:hover:text-white dark:hover:bg-gray-700">
            Proses
          </button>
          <button id="btnAppsTab" class="px-2.5 py-1 rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-200 border border-transparent transition dark:text-gray-300 dark:hover:text-white dark:hover:bg-gray-700">
            Aplikasi
          </button>
        </div>
        <div class="flex items-center gap-1">
          <button id="btnRefresh" title="Refresh"
                  class="flex items-center justify-center text-gray-600 hover:text-gray-900 bg-gray-200 hover:bg-gray-300 border border-gray-300 rounded-lg p-1.5 transition dark:text-gray-300 dark:hover:text-white dark:bg-gray-700 dark:hover:bg-gray-600 dark:border-gray-600">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
          </button>
        </div>
      </div>
      <div class="overflow-auto flex-1">
        <div id="procPanel">
          <table class="w-full text-xs">
            <thead>
              <tr class="bg-gray-100 text-gray-500 dark:bg-gray-800/60 dark:text-gray-400">
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">PID</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Name</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">User</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">CPU %</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Mem MB</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Aksi</th>
              </tr>
            </thead>
            <tbody id="procBody"></tbody>
          </table>
        </div>
        <div id="appsPanel" class="hidden">
          <table class="w-full text-xs">
            <thead>
              <tr class="bg-gray-100 text-gray-500 dark:bg-gray-800/60 dark:text-gray-400">
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Aplikasi</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Versi</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Publisher</th>
                <th class="px-3 py-2 text-left font-medium sticky top-0 bg-gray-100 dark:bg-gray-800">Tanggal Instal</th>
              </tr>
            </thead>
            <tbody id="appsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get("token") || __RD_TOKEN__;
    const clientId = __CLIENT_ID_JSON__;
    const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/viewer?token=${encodeURIComponent(token)}`;

    let ws = null;
    let drawBusy = false;
    let latestJpeg = null;
    const pressedKeys = new Set();

    const $ = (id) => document.getElementById(id);
    $("offlineId").textContent = clientId;

    function setStatus(text, isError = false) {
      const el = $("status");
      el.textContent = text;
      el.className = "text-sm rounded-lg px-3 py-2 border " + (
        isError
          ? "text-red-700 bg-red-50 border-red-300 dark:text-red-300 dark:bg-red-500/10 dark:border-red-500/30"
          : "text-emerald-700 bg-emerald-50 border-emerald-300 dark:text-emerald-300 dark:bg-emerald-500/10 dark:border-emerald-500/30"
      );
    }

    function uuid() {
      return window.crypto?.randomUUID
        ? window.crypto.randomUUID()
        : "req-" + Math.random().toString(36).slice(2);
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        setStatus("Terhubung ke server");
        send({ action: "select", client: clientId });
      };

      ws.onclose = (ev) => {
        if (ev.code === 4001) {
          setStatus("Token salah", true);
          return;
        }
        setStatus("Terputus, mencoba ulang...", true);
        setTimeout(connect, 2000);
      };

      ws.onerror = () => setStatus("WebSocket error", true);

      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") {
          try {
            handleJson(JSON.parse(ev.data));
          } catch (e) {
            console.error(e);
          }
        } else {
          handleBinary(ev.data);
        }
      };
    }

    function handleJson(msg) {
      if (msg.type === "client_list") {
        const found = (msg.clients || []).some((c) => c.id === clientId);
        $("offline").classList.toggle("hidden", found);
        $("offline").classList.toggle("flex", !found);

        const c = (msg.clients || []).find((x) => x.id === clientId);
        if (c && c.info) {
          $("title").textContent = c.info.hostname || clientId;
          $("sysinfo").textContent =
            `${c.info.hostname || clientId} | IP: ${c.info.ip || "?"} | ` +
            `OS: ${c.info.os || "?"} | User: ${c.info.user || "?"} | Layar: ${c.info.screen || "?"}`;
        } else {
          $("sysinfo").textContent = "";
        }
      } else if (msg.type === "tasks_response") {
        renderTasks(msg);
      } else if (msg.type === "apps_response") {
        renderApps(msg);
      } else if (msg.type === "kill_response") {
        if (msg.ok) {
          setStatus(`PID ${msg.pid} dihentikan`);
        } else {
          setStatus(`Gagal kill PID ${msg.pid}: ${msg.error}`, true);
        }
        refreshTasks();
      } else if (msg.type === "power_response") {
        const label = msg.action === "restart" ? "Restart" : "Shutdown";
        if (msg.ok) {
          setStatus(`${label}: perintah terkirim, komputer akan mati/nyala ulang`);
        } else {
          setStatus(`Gagal ${label}: ${msg.error}`, true);
        }
      } else if (msg.type === "error") {
        setStatus(msg.message || "Error", true);
      }
    }

    function handleBinary(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length < 2) return;

      const idLen = bytes[0];
      if (bytes.length < 1 + idLen) return;

      const id = new TextDecoder().decode(bytes.slice(1, 1 + idLen));
      if (id !== clientId) return;

      const jpeg = bytes.slice(1 + idLen);
      queueDraw(jpeg);
    }

    function queueDraw(jpeg) {
      latestJpeg = jpeg;
      if (!drawBusy) processDraw();
    }

    async function processDraw() {
      drawBusy = true;
      while (latestJpeg) {
        const data = latestJpeg;
        latestJpeg = null;

        try {
          const blob = new Blob([data], { type: "image/jpeg" });
          const bmp = await createImageBitmap(blob);
          const canvas = $("screen");

          if (canvas.width !== bmp.width) canvas.width = bmp.width;
          if (canvas.height !== bmp.height) canvas.height = bmp.height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(bmp, 0, 0);
          bmp.close();
        } catch (e) {
          console.error("draw error", e);
        }
      }
      drawBusy = false;
    }

    function refreshTasks() {
      send({ action: "get_tasks", client: clientId, req_id: uuid() });
      setStatus("Meminta task manager...");
    }

    function refreshApps() {
      send({ action: "get_apps", client: clientId, req_id: uuid() });
      setStatus("Meminta daftar aplikasi...");
    }

    function showTab(name) {
      const isProcs = name === "procs";
      $("procPanel").classList.toggle("hidden", !isProcs);
      $("appsPanel").classList.toggle("hidden", isProcs);

      $("btnProcsTab").className = "px-2.5 py-1 rounded-lg border transition " + (
        isProcs
          ? "bg-blue-600 text-white border-blue-600 dark:bg-blue-500 dark:border-blue-500"
          : "text-gray-600 hover:text-gray-900 hover:bg-gray-200 border-transparent dark:text-gray-300 dark:hover:text-white dark:hover:bg-gray-700"
      );
      $("btnAppsTab").className = "px-2.5 py-1 rounded-lg border transition " + (
        !isProcs
          ? "bg-blue-600 text-white border-blue-600 dark:bg-blue-500 dark:border-blue-500"
          : "text-gray-600 hover:text-gray-900 hover:bg-gray-200 border-transparent dark:text-gray-300 dark:hover:text-white dark:hover:bg-gray-700"
      );

      if (!isProcs) refreshApps();
    }

    function killProcess(pid, name) {
      if (!confirm(`Hentikan proses ${name} (PID ${pid})?`)) return;
      send({ action: "kill", client: clientId, pid: pid, req_id: uuid() });
    }

    function powerAction(action, label) {
      if (!confirm(`${label} komputer client secara paksa?`)) return;
      send({ action: action, client: clientId, req_id: uuid() });
      setStatus(`Mengirim perintah ${label}...`);
    }

    function renderTasks(msg) {
      const system = msg.system || {};
      $("sysinfo").textContent =
        `${system.hostname || clientId || "?"} | ` +
        `OS: ${system.os || "?"} | ` +
        `CPU: ${system.cpu_percent ?? "?"}% | ` +
        `RAM: ${system.mem_percent ?? "?"}% ` +
        `(${system.mem_used_mb ?? "?"} / ${system.mem_total_mb ?? "?"} MB)`;

      const tbody = $("procBody");
      tbody.innerHTML = "";

      (msg.processes || []).forEach((p) => {
        const tr = document.createElement("tr");
        tr.className = "text-gray-700 border-b border-gray-200 hover:bg-gray-100 dark:text-gray-200 dark:border-gray-800 dark:hover:bg-gray-800/50";
        addCell(tr, p.pid);
        addCell(tr, p.name);
        addCell(tr, p.user);
        addCell(tr, p.cpu);
        addCell(tr, p.mem);

        const td = document.createElement("td");
        td.className = "px-3 py-1.5";
        const btn = document.createElement("button");
        btn.textContent = "Kill";
        btn.className = "text-xs text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 rounded px-2 py-1 transition dark:text-red-300 dark:bg-red-500/10 dark:hover:bg-red-500/20 dark:border-red-500/30";
        btn.onclick = () => killProcess(p.pid, p.name);
        td.appendChild(btn);
        tr.appendChild(td);

        tbody.appendChild(tr);
      });

      setStatus(`Task manager: ${(msg.processes || []).length} proses ditampilkan`);
    }

    function renderApps(msg) {
      const tbody = $("appsBody");
      tbody.innerHTML = "";

      const apps = msg.apps || [];
      apps.forEach((a) => {
        const tr = document.createElement("tr");
        tr.className = "text-gray-700 border-b border-gray-200 hover:bg-gray-100 dark:text-gray-200 dark:border-gray-800 dark:hover:bg-gray-800/50";
        addCell(tr, a.name);
        addCell(tr, a.version);
        addCell(tr, a.publisher);
        addCell(tr, a.install_date);
        tbody.appendChild(tr);
      });

      if (msg.error) {
        setStatus(`Aplikasi: ${msg.error}`, true);
      } else {
        setStatus(`Aplikasi terinstal: ${apps.length} ditemukan`);
      }
    }

    function addCell(tr, value) {
      const td = document.createElement("td");
      td.className = "px-3 py-1.5 align-top";
      td.textContent = value ?? "";
      tr.appendChild(td);
    }

    function getPos(e) {
      const canvas = $("screen");
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x: 0, y: 0 };

      return {
        x: Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)),
        y: Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height))
      };
    }

    function buttonName(button) {
      if (button === 0) return "left";
      if (button === 1) return "middle";
      if (button === 2) return "right";
      return "left";
    }

    function sendInput(data) {
      send({ action: "input", client: clientId, data });
    }

    function mapKey(e) {
      const special = {
        "Control": "ctrl",
        "Meta": "winleft",
        "OS": "winleft",
        " ": "space",
        "Escape": "esc",
        "ArrowUp": "up",
        "ArrowDown": "down",
        "ArrowLeft": "left",
        "ArrowRight": "right",
        "PageUp": "pageup",
        "PageDown": "pagedown",
        "Delete": "delete",
        "Backspace": "backspace",
        "Enter": "enter",
        "Tab": "tab",
        "Alt": "alt",
        "Shift": "shift",
        "CapsLock": "capslock",
        "ContextMenu": "apps",
        "PrintScreen": "printscreen",
        "Pause": "pause",
        "NumLock": "numlock"
      };

      if (e.key.length === 1) return e.key.toLowerCase();
      return special[e.key] || e.key.toLowerCase();
    }

    $("btnRefresh").addEventListener("click", () => {
      const appsOpen = !$("appsPanel").classList.contains("hidden");
      if (appsOpen) {
        refreshApps();
      } else {
        refreshTasks();
      }
    });
    $("btnProcsTab").addEventListener("click", () => {
      showTab("procs");
      refreshTasks();
    });
    $("btnAppsTab").addEventListener("click", () => showTab("apps"));
    $("btnShutdown").addEventListener("click", () => powerAction("shutdown", "Force Shutdown"));
    $("btnRestart").addEventListener("click", () => powerAction("restart", "Restart"));

    function setupTheme() {
      const el = $("themeToggle");
      if (el) {
        el.addEventListener("click", () => {
          const dark = document.documentElement.classList.toggle("dark");
          try {
            localStorage.setItem("rd-theme", dark ? "dark" : "light");
          } catch (e) {}
        });
      }
    }
    setupTheme();

    const canvas = $("screen");

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("mousedown", (e) => {
      e.preventDefault();
      canvas.focus();
      const p = getPos(e);
      sendInput({ event: "down", button: buttonName(e.button), x: p.x, y: p.y });
    });

    canvas.addEventListener("mouseup", (e) => {
      e.preventDefault();
      const p = getPos(e);
      sendInput({ event: "up", button: buttonName(e.button), x: p.x, y: p.y });
    });

    window.addEventListener("mouseup", (e) => {
      if (e.target !== canvas) {
        const p = getPos(e);
        sendInput({ event: "up", button: buttonName(e.button), x: p.x, y: p.y });
      }
    });

    let lastMove = 0;
    canvas.addEventListener("mousemove", (e) => {
      const now = Date.now();
      if (now - lastMove < 25) return;
      lastMove = now;

      const p = getPos(e);
      sendInput({ event: "move", x: p.x, y: p.y });
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      sendInput({ event: "scroll", amount: -Math.sign(e.deltaY) * 3 });
    }, { passive: false });

    canvas.addEventListener("keydown", (e) => {
      e.preventDefault();
      const key = mapKey(e);
      if (pressedKeys.has(key)) return;
      pressedKeys.add(key);
      sendInput({ event: "keydown", key });
    });

    canvas.addEventListener("keyup", (e) => {
      e.preventDefault();
      const key = mapKey(e);
      pressedKeys.delete(key);
      sendInput({ event: "keyup", key });
    });

    canvas.addEventListener("blur", () => {
      pressedKeys.forEach((key) => {
        sendInput({ event: "keyup", key });
      });
      pressedKeys.clear();
    });

    connect();

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) {
        drawBusy = false;
        latestJpeg = null;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connect();
        }
      }
    });
  </script>
</body>
</html>
